# Pack CI (C-07). Pull requests run every check. A tag `ontology-v*` publishes signed releases through a protected environment.
# NOT RUN: written without a runner. Review the first execution. Variables to set in the repository:
#   AWS_PUBLISHER_ROLE_ARN, AWS_REGION, REGISTRY_BUCKET, SIGNING_KEY_ARN (outputs of platform-iac/registry/template.yaml).
# Create a GitHub environment `ontology-release` with required reviewers (two people: the lead ontology engineer and the platform lead).
name: ontology-ci
on:
  pull_request:
    # Everything the checks run over, including the dependency files: a change to requirements-dev.txt must run CI too.
    paths: ["ontology/**", "evals/**", "src/**", "services/connectors/**", "tests/**", "config/**", "scripts/**",
            "requirements-dev.txt", "pyproject.toml", ".github/workflows/ontology-ci.yml"]
  push:
    tags: ["ontology-v*"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-dev.txt
      - run: python ontology/tools/check_ontology.py
      - run: python -m pytest ontology/tests -q
      - run: python evals/tools/check_golden.py
      - run: python -m pytest evals/tests -q
      - run: python -m pytest tests -q
      - run: cd services/connectors && python -m pip install -r requirements-dev.txt && python -m pytest -q

  publish:
    if: startsWith(github.ref, 'refs/tags/ontology-v')
    needs: checks
    runs-on: ubuntu-latest
    environment: ontology-release            # required reviewers gate this job; the AWS role trusts only this environment
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-dev.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISHER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Publish signed releases
        run: >
          python scripts/registry.py publish
          --signer "kms:${{ vars.SIGNING_KEY_ARN }}"
          --bucket "${{ vars.REGISTRY_BUCKET }}"
          --actor "${{ github.actor }} via ${{ github.ref_name }}"
