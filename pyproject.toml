[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usep"
version = "0.1.0"
description = "Universal Semantic Engineering Platform (USEP) — Phase 1 foundation (excludes source connectors)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "uuid6>=2024.7.10",
  "structlog>=24.4",
  "opentelemetry-api>=1.27",
  "cryptography>=43.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.2"]
s3 = ["boto3>=1.35"]
kafka = ["aiokafka>=0.11"]
vault = ["hvac>=2.3"]
http = ["httpx>=0.27"]
all = [
  "usep[postgres,s3,kafka,vault,http]",
]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "import-linter>=2.1",
  "pre-commit>=4.0",
  "moto>=5.0",
  "types-PyYAML",
  "hvac>=2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/usep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = [
  "integration: needs Postgres / S3-fake / event-bus-fake services (docker compose)",
]
addopts = "-q -ra --strict-markers"

[tool.coverage.run]
source = [
  "usep.ingestion.domain",
  "usep.ingestion.runtime",
  "usep.ingestion.sensitive",
  "usep.ingestion.cursor",
  "usep.ingestion.raw",
]
branch = true

[tool.coverage.report]
fail_under = 85
skip_empty = true

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
# usep.ontology predates this phase and is explicitly out of scope to modify
# (Phase 1 prompt, section 2: "Do not modify ontology/"). Its own style is
# intentionally left alone rather than reformatted as a side effect of this PR.
extend-exclude = ["src/usep/ontology"]

[tool.ruff.lint]
# Standards 9.3 reference set (E W F I B UP SIM S PL RUF D) plus BLE (no blind except outside a
# top-level handler, 3.6), ASYNC, C90 (complexity), N (naming), DTZ (no naive datetimes), G and
# LOG (logging), T20 (no print), ERA (no commented-out code), C4, RET, PERF, PIE, TID, PT, FURB,
# PGH, RSE, ISC and TRY. Not enabled: TC (pydantic needs runtime imports), ARG (no-op methods that
# satisfy a Protocol), ANN (mypy --strict covers annotations) and EM (exception-message style).
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "S", "PL", "RUF", "D",
  "BLE", "ASYNC", "C90", "N", "DTZ", "G", "LOG", "T20", "ERA", "C4", "RET", "PERF", "PIE", "TID",
  "PT", "FURB", "PGH", "RSE", "ISC", "TRY",
]
ignore = [
  "E501",    # line length is the formatter's job
  "PLR0913", "PLR0917",  # ports and the writer take their dependencies as arguments by design
  "TRY003",  # exception messages name the operation and context (standards 1.3)
  "TRY400",  # failures log exception type and frames only: logger.exception would print the message,
             # which can echo secrets or source content
  "D100", "D104",  # per the standards reference config
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S311", "PLC0415", "PLR2004", "D"]
# ontology/ and evals/ predate these rules and are out of scope to modify; they keep the old rule set.
"ontology/**" = ["W", "S", "PL", "RUF", "D", "BLE", "C90", "N", "DTZ", "G", "LOG", "T20", "ERA", "C4", "RET", "PERF", "PIE", "TID", "PT", "FURB", "PGH", "RSE", "ISC", "TRY"]
"evals/**" = ["W", "S", "PL", "RUF", "D", "BLE", "C90", "N", "DTZ", "G", "LOG", "T20", "ERA", "C4", "RET", "PERF", "PIE", "TID", "PT", "FURB", "PGH", "RSE", "ISC", "TRY"]

[tool.ruff.lint.isort]
known-first-party = ["usep"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
  "usep.core.*",
  "usep.adapters.*",
  "usep.ingestion.cursor.*",
  "usep.ingestion.domain.*",
  "usep.ingestion.ports.*",
  "usep.ingestion.raw.*",
  "usep.ingestion.runtime.*",
  "usep.ingestion.sensitive.*",
]
strict = true

# These vendor SDKs ship no type stubs; adapters are the one place vendor imports are allowed.
[[tool.mypy.overrides]]
module = ["hvac.*", "hvac", "boto3.*", "aiokafka.*", "botocore.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "usep"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain/ports/runtime/sensitive/cursor/raw/pipeline never import vendor SDKs or adapters"
type = "forbidden"
source_modules = [
  "usep.ingestion.domain",
  "usep.ingestion.ports",
  "usep.ingestion.runtime",
  "usep.ingestion.sensitive",
  "usep.ingestion.cursor",
  "usep.ingestion.raw",
]
forbidden_modules = [
  "usep.adapters",
  "boto3",
  "aiokafka",
  "hvac",
  "psycopg",
  "httpx",
]
