[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usep"
version = "0.1.0"
description = "Universal Semantic Engineering Platform (USEP) — Phase 1 foundation (excludes source connectors)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "uuid6>=2024.7.10",
  "structlog>=24.4",
  "opentelemetry-api>=1.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.2"]
s3 = ["boto3>=1.35"]
kafka = ["aiokafka>=0.11"]
vault = ["hvac>=2.3"]
crypto = ["cryptography>=43.0"]
http = ["httpx>=0.27"]
all = [
  "usep[postgres,s3,kafka,vault,crypto,http]",
]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "import-linter>=2.1",
  "pre-commit>=4.0",
  "moto>=5.0",
  "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/usep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "src"]
markers = [
  "integration: needs Postgres / S3-fake / event-bus-fake services (docker compose)",
]
addopts = "-q"

[tool.coverage.run]
source = [
  "usep.ingestion.domain",
  "usep.ingestion.runtime",
  "usep.ingestion.sensitive",
  "usep.ingestion.cursor",
  "usep.ingestion.raw",
]
branch = true

[tool.coverage.report]
fail_under = 85
skip_empty = true

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
# usep.ontology predates this phase and is explicitly out of scope to modify
# (Phase 1 prompt, section 2: "Do not modify ontology/"). Its own style is
# intentionally left alone rather than reformatted as a side effect of this PR.
extend-exclude = ["src/usep/ontology"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["usep"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
  "usep.core.*",
  "usep.ingestion.domain.*",
  "usep.ingestion.ports.*",
  "usep.ingestion.runtime.*",
  "usep.ingestion.sensitive.*",
]
strict = true

# Adapters are outside the mypy --strict scope (section 1); these vendor SDKs ship
# no type stubs, and adapters are the one place vendor imports are allowed at all.
[[tool.mypy.overrides]]
module = ["hvac.*", "hvac", "boto3.*", "aiokafka.*", "botocore.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "usep"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain/ports/runtime/sensitive/cursor/raw/pipeline never import vendor SDKs or adapters"
type = "forbidden"
source_modules = [
  "usep.ingestion.domain",
  "usep.ingestion.ports",
  "usep.ingestion.runtime",
  "usep.ingestion.sensitive",
  "usep.ingestion.cursor",
  "usep.ingestion.raw",
  "usep.ingestion.pipeline",
]
forbidden_modules = [
  "usep.adapters",
  "boto3",
  "aiokafka",
  "hvac",
  "psycopg",
  "httpx",
]
