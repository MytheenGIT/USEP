# USEP Golden Set — Engineering Domain
# Source: HLD 9 (at least 150 items per domain at pilot start, growing to 300)
# Template: golden-set-item.yaml
# Stratified by template and difficulty. Each item owned by a named SME.
# Items are held out from prompt and template tuning (HLD 9).
# Domain: engineering | Count: see evals/tools/check_golden.py (floor 150)
#
# STATUS: DRAFT, synthetic. Entity names, evidence IDs and claims are proposals (OI-49), not facts from
# any source system. Each item must be checked against pilot data by its SME before it is used to score
# recall at K = 8 or evidence support. Do not publish scores from this file until then.
# sme_owner holds a role placeholder until named owners are known.

items:

