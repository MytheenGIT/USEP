# Adds values to core vocabularies. Never removes or renumbers a core value.
extends:
  regulatory_scope:
    add: [gdpr_retail, pci_dss, food_safety, age_restricted_goods]

terms:
  - id: retail_channel
    values: [in_store, online, mobile_app, marketplace, wholesale]

  - id: supplier_agreement_type
    values: [direct_supply, drop_ship, consignment, franchise]
