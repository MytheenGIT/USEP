# Source: HLD 6 Table 9 relationship type depends_on; LLD 4 traversal limits.
name: dependencies_of
version: "1.0"
status: draft
owner_role: lead-ontology-engineer
description: "What an entity depends on, up to depth, following depends_on and consumes edges"
parameters:
  - {name: tenant_id, type: uuid, required: true, from: token}
  - {name: anchor_id, type: uuid, required: true}
  - {name: depth,     type: integer, default: 2, min: 1, max: 3}
limits: {max_depth: 3, fanout_cap: 200}
access: "{{access_predicate}} is supplied by the context engine (ADR-06)."
steps:
  - id: downstream
    cypher: |
      MATCH p = (a:Entity {tenant_id: $tenant_id, entity_id: $anchor_id})-[:depends_on|consumes*1..3]->(n:Entity)
      WHERE length(p) <= $depth
        AND all(x IN nodes(p) WHERE x.tenant_id = $tenant_id AND {{access_predicate}})
      RETURN DISTINCT n.entity_id AS entity_id, labels(n) AS labels, min(length(p)) AS hops
      ORDER BY hops, n.entity_id
      LIMIT $fanout_cap
returns: [downstream, cut_points]
