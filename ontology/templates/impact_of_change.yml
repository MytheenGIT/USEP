# Query template. Source: HLD 6 Table 9 (impact_of_change(service, depth = 2)) and the worked example in HLD 6.2;
# LLD 4 traversal (depth up to 3, fan-out cap 200, cut points reported). Cypher text is a proposal (P) until S6 tests run.
name: impact_of_change
version: "1.0"
status: draft
owner_role: lead-ontology-engineer
description: "What a change to one entity affects: realizing services, exposed and consumed APIs, owners, governing policies, last incidents"
parameters:
  - {name: tenant_id,  type: uuid, required: true, from: token}
  - {name: anchor_id,  type: uuid, required: true}
  - {name: depth,      type: integer, default: 2, min: 1, max: 3}
  - {name: as_of,      type: datetime, default: now}
limits: {max_depth: 3, fanout_cap: 200}
access: "{{access_predicate}} is supplied by the context engine from the policy decision point. Paths the requester may not see are pruned during traversal, not filtered afterwards (ADR-06)."
steps:
  - id: reach
    description: "Entities connected to the anchor through structural edges, up to depth"
    cypher: |
      MATCH p = (a:Entity {tenant_id: $tenant_id, entity_id: $anchor_id})
                -[:realizes|exposes|consumes|depends_on|deployed_to*1..3]-(n:Entity)
      WHERE length(p) <= $depth
        AND all(x IN nodes(p) WHERE x.tenant_id = $tenant_id AND {{access_predicate}}
                AND x.valid_from <= $as_of AND (x.valid_to IS NULL OR x.valid_to > $as_of))
      RETURN DISTINCT n.entity_id AS entity_id, labels(n) AS labels, min(length(p)) AS hops
      ORDER BY hops, n.entity_id
      LIMIT $fanout_cap
  - id: owners
    description: "Owning team of every entity reached"
    cypher: |
      MATCH (t:Team {tenant_id: $tenant_id})-[:owns]->(n:Entity {tenant_id: $tenant_id})
      WHERE n.entity_id IN $reached_ids AND {{access_predicate}}
      RETURN n.entity_id AS entity_id, t.entity_id AS team_id
      LIMIT $fanout_cap
  - id: policies
    description: "Policies and controls that govern the reached entities"
    cypher: |
      MATCH (n:Entity {tenant_id: $tenant_id})-[:governed_by]->(g:Entity {tenant_id: $tenant_id})
      WHERE n.entity_id IN $reached_ids AND {{access_predicate}} AND (g:Policy OR g:Control)
      RETURN n.entity_id AS entity_id, g.entity_id AS governing_id, labels(g) AS labels
      LIMIT $fanout_cap
  - id: incidents
    description: "Most recent incidents caused by the reached entities"
    cypher: |
      MATCH (i:Incident {tenant_id: $tenant_id})-[:caused_by]->(n:Entity {tenant_id: $tenant_id})
      WHERE n.entity_id IN $reached_ids AND {{access_predicate}}
      RETURN i.entity_id AS incident_id, n.entity_id AS caused_by_id, i.valid_from AS occurred
      ORDER BY occurred DESC
      LIMIT 10
returns: [reached, owners, policies, incidents, cut_points]
