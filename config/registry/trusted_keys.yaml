# Keys whose signatures the registry client accepts (ADR-20). Public keys only; the private key never leaves AWS KMS.
# Add the production key after the platform lead creates it (platform-iac/registry/template.yaml):
#   python scripts/registry.py public-key --kms <key arn>      prints an entry to paste here
# To retire a key set `status: revoked` in a reviewed pull request. Every release it signed then stops loading, so re-sign first.
# Empty until a key exists: with no trusted key, nothing signed can load.
keys: []
